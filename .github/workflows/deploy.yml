# Build marketing site + shops and deploy to Hostinger (sakora.shop).
# Required GitHub secrets:
#   FTP_SERVER      e.g. ftp.sakora.shop
#   FTP_USERNAME    e.g. u761347833.dev
#   FTP_PASSWORD
# Optional:
#   FTP_SERVER_DIR  folder on the server. Leave empty to use the FTP login folder.
name: Deploy website to Hostinger

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: website-deploy
  cancel-in-progress: true

jobs:
  desktop-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Windows installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_MIRROR: https://cdn.npmmirror.com/binaries/electron/
        run: |
          unset GITHUB_TOKEN
          unset GH_TOKEN
          npm ci
          npx electron-builder --win nsis --x64

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop/dist/Sakora-Setup.exe
          if-no-files-found: error

  desktop-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Mac disk image
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_MIRROR: https://cdn.npmmirror.com/binaries/electron/
        run: |
          unset GITHUB_TOKEN
          unset GH_TOKEN
          npm ci
          npx electron-builder --mac dmg --universal

      - name: Upload Mac disk image
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: desktop/dist/Sakora.dmg
          if-no-files-found: error

  deploy:
    needs: [desktop-windows, desktop-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_APP_URL: https://app.sakora.shop
          VITE_API_URL: https://nexifour.ng/sakora/api
          VITE_SITE_URL: https://sakora.shop
          VITE_STOREFRONT_URL: https://sakora.shop
          VITE_SOCKET_URL: https://nexifour.ng

      - name: Add desktop downloads
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist/downloads
          merge-multiple: true

      - name: Resolve FTP directory
        id: ftp
        env:
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          dir="${FTP_SERVER_DIR}"
          if [ -z "$dir" ] || [ "$dir" = "/" ]; then
            dir="./"
          fi
          case "$dir" in
            */) ;;
            *) dir="${dir}/" ;;
          esac
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      # Hostinger often resets the FTP data connection while creating the
      # first folder. Secrets stay action inputs so characters in the
      # password are not parsed as YAML.
      - name: Deploy via FTPS
        id: deploy1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: ${{ steps.ftp.outputs.dir }}
          dangerous-clean-slate: false
          timeout: 900000

      - name: Wait before FTP retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20

      - name: Deploy via FTPS (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: ${{ steps.ftp.outputs.dir }}
          dangerous-clean-slate: false
          timeout: 900000

      - name: Wait before final FTP retry
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 20

      - name: Deploy via FTPS (attempt 3)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: ${{ steps.ftp.outputs.dir }}
          dangerous-clean-slate: false
          timeout: 900000
